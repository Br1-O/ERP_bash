<section class="manager">
    <div class="manager-toolbar card">
        <div class="manager-filters">
            <label class="search-field">
                <span>Buscar pedido</span>
                <input type="search" data-order-search placeholder="Cliente, nota o número…">
            </label>
            <label class="field compact-field">
                <span>Estado</span>
                <select data-order-status-filter>
                    <option value="all">Todos</option>
                    <option value="pending">Pendientes</option>
                    <option value="finished">Finalizados</option>
                    <option value="cancel">Cancelados</option>
                </select>
            </label>
        </div>
        <button class="btn primary" type="button" data-create-order>+ Nuevo pedido</button>
    </div>

    <article class="card manager-card">
        <header class="card-header">
            <div>
                <span class="eyebrow">Pedidos de clientes</span>
                <h3>Seguimiento de ventas</h3>
            </div>
            <span class="badge badge-soft" data-order-count>0 pedidos</span>
        </header>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr><th>Pedido</th><th>Fecha</th><th>Cliente</th><th>Ítems</th><th>Unidades</th><th>Total</th><th>Estado</th></tr>
                </thead>
                <tbody data-order-body></tbody>
            </table>
        </div>
        <div class="empty-state" data-order-empty hidden>
            <strong>No hay pedidos para mostrar</strong>
            <span>Ajuste los filtros o cree un pedido nuevo.</span>
        </div>
        <erp-pagination data-order-pagination></erp-pagination>
    </article>
</section>

<erp-modal id="order-detail-modal" title="Detalle del pedido" size="wide"></erp-modal>

<erp-modal id="order-form-modal" title="Pedido" size="wide">
    <form class="form-stack" data-order-form>
        <div class="form-grid">
            <label class="field span-2">
                <span>Cliente</span>
                <select data-order-customer></select>
            </label>
            <label class="field">
                <span>Nombre del cliente</span>
                <input type="text" data-order-customer-name maxlength="80" placeholder="Consumidor final">
            </label>
            <label class="field">
                <span>Tipo</span>
                <select data-order-customer-type>
                    <option value="Minorista">Minorista</option>
                    <option value="Mayorista">Mayorista</option>
                </select>
            </label>
            <label class="field">
                <span>Teléfono</span>
                <input type="text" data-order-customer-phone maxlength="40">
            </label>
            <label class="field">
                <span>Email</span>
                <input type="email" data-order-customer-email maxlength="100">
            </label>
            <label class="field checkbox-field span-2" data-order-save-customer-field>
                <span>Guardar o actualizar los datos del cliente</span>
                <input type="checkbox" data-order-save-customer checked>
            </label>
            <label class="field">
                <span>Método de pago</span>
                <select data-order-payment>
                    <option value="Efectivo">Efectivo</option>
                    <option value="Transferencia">Transferencia</option>
                    <option value="Tarjeta">Tarjeta</option>
                </select>
            </label>
            <label class="field">
                <span>Estado</span>
                <select data-order-state>
                    <option value="pending">Pendiente</option>
                    <option value="finished">Finalizado</option>
                    <option value="cancel">Cancelado</option>
                </select>
            </label>
            <label class="field">
                <span>Descuento</span>
                <select data-order-discount-type>
                    <option value="none">Sin descuento</option>
                    <option value="percent">Porcentaje</option>
                    <option value="fixed">Monto fijo</option>
                </select>
            </label>
            <label class="field">
                <span>Valor del descuento</span>
                <input type="number" min="0" step="0.01" data-order-discount-value value="0">
            </label>
            <label class="field span-2">
                <span>Notas</span>
                <textarea data-order-notes rows="2" placeholder="Observaciones para el cliente o la entrega…"></textarea>
            </label>
        </div>

        <div class="order-items-section">
            <header class="combo-editor-header">
                <div>
                    <strong>Productos del pedido</strong>
                    <p class="muted">Agregue productos del catálogo o ajuste el precio unitario manualmente.</p>
                </div>
                <button class="btn ghost small" type="button" data-order-add-item>+ Agregar producto</button>
            </header>
            <div class="order-item-rows" data-order-items></div>
        </div>

        <div class="order-total-preview" data-order-totals></div>
        <p class="form-error" data-order-error hidden></p>
        <div class="form-actions">
            <button class="btn ghost" type="button" data-order-cancel>Cancelar</button>
            <button class="btn primary" type="submit" data-order-submit>Guardar pedido</button>
        </div>
    </form>
</erp-modal>

<erp-invoice-generator id="order-invoice"></erp-invoice-generator>
