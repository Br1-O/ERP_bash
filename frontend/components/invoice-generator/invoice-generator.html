<erp-modal id="invoice-modal" title="Comprobante" size="wide">
    <div class="invoice-preview" data-invoice-preview></div>
    <p class="form-error" data-invoice-error hidden></p>
    <div class="form-actions">
        <button class="btn ghost" type="button" data-invoice-close>Cerrar</button>
        <button class="btn ghost" type="button" data-invoice-print>Imprimir</button>
        <button class="btn primary" type="button" data-invoice-pdf>Descargar PDF</button>
    </div>
</erp-modal>
